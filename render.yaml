services:
  - type: web
    name: ace-bank-lite
    runtime: docker
    plan: free
    envVars:
      # --- Database Configuration ---
      - key: DB_URL
        sync: false   # Set this in Render Dashboard: jdbc:mysql://<host>:<port>/<dbname>?useSSL=true&allowPublicKeyRetrieval=true
      - key: DB_USER
        sync: false   # Set this in Render Dashboard
      - key: DB_PASSWORD
        sync: false   # Set this in Render Dashboard
      - key: DB_MYSQL_DRIVER
        value: "com.mysql.cj.jdbc.Driver"
      - key: DB_SCRIPT_PATH
        value: "/sql/schema_initializer.sql"

      # --- Email / Brevo API Configuration ---
      - key: MAIL_DEFAULT_ADDRESS
        sync: false   # Set this in Render Dashboard: your sender email
      - key: BREVO_API_KEY
        sync: false   # Set this in Render Dashboard: your Brevo API key
